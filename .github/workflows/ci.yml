name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (clippy + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portex_rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: portex_rust
      # No `cargo fmt --check` gate: the codebase deliberately uses wider
      # lines than rustfmt's default, and reformatting it is a separate call.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  django:
    name: Django (checks + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portex_server/portex
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: portex_test
          POSTGRES_USER: portex
          POSTGRES_PASSWORD: portex
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      SECRET_KEY: ci-secret-key-not-used-anywhere-else
      DEBUG: 'False'
      DB_ENGINE: postgresql_psycopg2
      POSTGRES_DB: portex_test
      POSTGRES_USER: portex
      POSTGRES_PASSWORD: portex
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      MAIN_HOST: portex.live
      CORS_ALLOWED_ORIGINS: https://portex.live
      LOG_DIR: /tmp/portex-logs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: portex_server/portex/requirements.txt
      - run: pip install -r requirements.txt
      - name: System checks
        run: python manage.py check --deploy --fail-level ERROR
      - name: Tests
        run: python manage.py test app -v 2

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: portex_rust
      - name: Build the CLI
        run: cargo build --release --bin portex
        working-directory: portex_rust
      - name: Prepare env
        run: |
          set -eu
          REDIS_PASSWORD=$(python3 -c "from secrets import token_urlsafe; print(token_urlsafe(32))")
          SECRET_KEY=$(python3 -c "from secrets import token_urlsafe; print(token_urlsafe(50))")
          DB_PASSWORD=$(python3 -c "from secrets import token_urlsafe; print(token_urlsafe(24))")
          printf 'REDIS_PASSWORD=%s\nPORTEX_BASE_DOMAIN=localtest.me\n' "$REDIS_PASSWORD" > .env
          sed -e "s|replace-me-with-a-long-random-string|$SECRET_KEY|" \
              -e "s|replace-me-with-a-strong-password|$DB_PASSWORD|" \
              -e "s|^DEBUG=False|DEBUG=True|" \
              portex_server/portex/.env.example > portex_server/portex/.env
      - name: Bring up the stack
        run: docker compose up -d --build
      - name: Migrate
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T django python manage.py migrate --noinput && break
            sleep 5
          done
      - name: Smoke test
        run: ./test_e2e.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=100
