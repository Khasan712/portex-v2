# Full stack: Django control plane + Rust gateway + Redis + Postgres.
# Run from the repo root: `docker compose up --build`.
#
# Postgres and Redis are deliberately NOT published to the host. Docker's
# port publishing bypasses ufw/iptables, so a published port is reachable
# from the internet even behind a closed firewall — and Redis holds the
# auth index the gateway trusts. Reach them with `docker compose exec`, or
# bind to 127.0.0.1 explicitly if you really need a host port.

services:
  db:
    image: postgres:16
    container_name: portex_db
    restart: unless-stopped
    env_file: ./portex_server/portex/.env
    volumes:
      - postgres_data_portex:/var/lib/postgresql/data/

  redis:
    image: redis:alpine
    container_name: portex_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env — see .env.example}"]
    volumes:
      - portex_redis_data:/data

  django:
    build:
      context: ./portex_server/portex
    container_name: portex_django
    restart: unless-stopped
    command: bash entrypoint.sh
    env_file:
      - ./portex_server/portex/.env
      - ./.env
    volumes:
      - ./portex_server/portex:/portex
    depends_on:
      - db
      - redis
    ports:
      - "9091:9091"

  celery-worker:
    build:
      context: ./portex_server/portex
    container_name: portex_celery_worker
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=10 --pool=gevent
    env_file:
      - ./portex_server/portex/.env
      - ./.env
    volumes:
      - ./portex_server/portex:/portex
    depends_on:
      - django
      - redis

  gateway:
    build:
      context: ./portex_rust
    container_name: portex_gateway
    restart: unless-stopped
    environment:
      PORTEX_HTTP_ADDR: 0.0.0.0:8080
      PORTEX_TUNNEL_ADDR: 0.0.0.0:4443
      PORTEX_METRICS_ADDR: 0.0.0.0:9090
      PORTEX_BASE_DOMAIN: ${PORTEX_BASE_DOMAIN:-portex.live}
      # Apex and www. traffic is the control plane. Without this the landing
      # page, login, dashboard, admin and /install/ all 404 on the real domain.
      PORTEX_APEX_UPSTREAM: django:9091
      PORTEX_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env — see .env.example}@redis:6379/0
      RUST_LOG: info
    depends_on:
      - redis
    ports:
      - "8080:8080/tcp"
      - "4443:4443/udp"
      - "127.0.0.1:9090:9090/tcp"

volumes:
  postgres_data_portex:
  portex_redis_data:
